  <g fill="#FFFCED">
    <circle cx="411" cy="382" r="10"/>
    <circle cx="424" cy="392" r="10"/>
    <circle cx="419" cy="407" r="10"/>
    <circle cx="403" cy="407" r="10"/>
    <circle cx="398" cy="392" r="10"/>
  </g>

  <circle
    cx="411" cy="395" r="9"
