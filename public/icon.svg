<svg
  xmlns="http://www.w3.org/2000/svg"
  width="512"
  height="512"
  viewBox="0 0 512 512"
>
  <defs>
    <linearGradient id="background" x2="0" y2="1">
      <stop stop-color="#E8F4DC"/>
      <stop offset="1" stop-color="#C6DFAE"/>
    </linearGradient>

    <linearGradient id="wood" x2="0" y2="1">
      <stop stop-color="#F7D19A"/>
      <stop offset="1" stop-color="#E6AF71"/>
    </linearGradient>

    <linearGradient id="roof" x2="0" y2="1">
      <stop stop-color="#F2AD84"/>
      <stop offset="1" stop-color="#D78566"/>
    </linearGradient>
  </defs>

  <!-- 奶油色底與綠色庭院 -->
  <rect width="512" height="512" rx="112" fill="#FFF8E9"/>

  <rect
    x="20" y="20"
    width="472" height="472"
    rx="102"
    fill="url(#background)"
  />

  <!-- 小小雲朵 -->
  <g fill="#FFFDF4" opacity=".85">
    <ellipse cx="112" cy="105" rx="34" ry="15"/>
    <circle cx="107" cy="94" r="17"/>
    <circle cx="127" cy="101" r="13"/>
  </g>

  <!-- 小屋陰影 -->
  <ellipse
    cx="257" cy="429"
    rx="169" ry="25"
    fill="#91AF78"
    opacity=".25"
  />

  <!-- 木屋 -->
  <path
    d="M111 224 256 105 401 224V404
       Q401 423 382 423H130
       Q111 423 111 404Z"
    fill="url(#wood)"
    stroke="#BB875D"
    stroke-width="9"
    stroke-linejoin="round"
  />

  <!-- 屋頂 -->
  <path
    d="M88 230 256 91 424 230"
    fill="none"
    stroke="#BA775B"
    stroke-width="43"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <path
    d="M88 222 256 83 424 222"
    fill="none"
    stroke="url(#roof)"
    stroke-width="34"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- 圓形小窗 -->
  <circle
    cx="256" cy="188" r="29"
