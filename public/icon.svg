  <g fill="#624736">
    <ellipse cx="292" cy="323" rx="7" ry="9"/>
    <ellipse cx="334" cy="323" rx="7" ry="9"/>
  </g>

  <g fill="#FFFFFF">
    <circle cx="294" cy="320" r="2.3"/>
    <circle cx="336" cy="320" r="2.3"/>
